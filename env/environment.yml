# Ambiente do grupo de estudo em geoprocessamento
#
# Uso (a partir do "Anaconda Prompt (miniconda3)"):
#   conda env create -f env\environment.yml
#   conda activate geoproc
#
# LÓGICA DESTE ARQUIVO
# Tudo que depende do GDAL vem do canal conda-forge, para que as bibliotecas
# compartilhem exatamente a mesma libgdal. O PyTorch e os pacotes dos modelos
# vêm pelo pip, na versão CPU, porque não dependem do GDAL e a instalação
# via pip é mais previsível no Windows.
#
# NUNCA rode "pip install rasterio" ou "pip install gdal" dentro deste
# ambiente. Isso quebra a ligação com a libgdal instalada pelo conda e o erro
# que aparece depois não tem relação aparente com a causa.

name: geoproc

channels:
  - conda-forge

dependencies:
  # --- Base ---
  - python=3.11
  - pip

  # --- Stack geoespacial (sempre do conda-forge) ---
  - gdal
  - rasterio
  - geopandas
  - rioxarray
  - xarray
  - shapely
  - pyproj
  - fiona

  # --- Científico ---
  - numpy
  - scipy
  - pandas
  - scikit-image
  - scikit-learn
  - matplotlib

  # --- Acesso a catálogos de imagem (usado pelo cubo na aula 03) ---
  - pystac-client
  - planetary-computer

  # --- Ambiente de trabalho ---
  - jupyterlab
  - ipykernel
  - tqdm

  # --- Pacotes que só existem no PyPI ---
  - pip:
      # PyTorch versão CPU. Se você tem placa NVIDIA, use o
      # environment-gpu.yml, que aponta para o índice CUDA.
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch
      - torchvision

      # Aula 02 - detecção de nuvens
      - omnicloudmask

      # Aula 03 - super-resolução (versão Lite, roda em CPU)
      # A versão Full exige mamba-ssm, que precisa de GPU e CUDA > 12.
      # Não usamos a Full neste curso.
      - sen2sr
      - mlstac
      - cubo
