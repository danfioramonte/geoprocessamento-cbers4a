          - aulas/99-erros-comuns.qmd

  page-footer:
    center: "Material aberto sob licença MIT. Grupo de estudo MAPEAR."

format:
  html:
    theme: cosmo
    toc: true
    toc-title: "Nesta página"
    code-copy: true
    code-overflow: wrap
    code-line-numbers: true
    highlight-style: github
